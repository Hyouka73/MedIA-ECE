# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - media-backend-api-chiapas

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and Start virtual environment and Install dependencies
        run: |
          cd backend
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/
            !backend/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout (needed for database SQL files)
        uses: actions/checkout@v4

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: backend_artifact/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EBAFB79E305B430D830B78EA580A5892 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A8A1DB2572A744BFB631B09901CA4452 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_28B19D00C1B94655B81C8DE6353A0A69 }}

      - name: Reset and seed database via psql
        run: |
          set -e

          # ── 1. Obtener DATABASE_URL del App Service ─────────────────────────────
          RG="rg-media-chiapas"
          APP="media-backend-api-chiapas"

          echo "Obteniendo DATABASE_URL de Azure App Service..."
          DB_URL=$(az webapp config appsettings list \
            --name "$APP" --resource-group "$RG" \
            --query "[?name=='DATABASE_URL'].value" -o tsv)

          if [ -z "$DB_URL" ]; then
            echo "ERROR: No se pudo obtener DATABASE_URL. Revisar permisos del Service Principal."
            exit 1
          fi

          # ── 2. Convertir URL de SQLAlchemy a psql estándar ─────────────────────
          # Formato entrada:  postgresql+asyncpg://user:pass@host:port/db
          # Formato salida:   postgresql://user:pass@host:port/db
          PSQL_URL=$(echo "$DB_URL" | sed 's|postgresql+asyncpg://|postgresql://|')
          echo "Conexión configurada (host enmascarado para log)."

          # ── 3. Instalar cliente psql ────────────────────────────────────────────
          sudo apt-get install -y postgresql-client

          # ── 4. Obtener IP del runner y abrir firewall de Azure PostgreSQL ───────
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "IP del runner: $RUNNER_IP"

          # Extraer nombre del servidor de PostgreSQL desde la URL
          # Formato host: servername.postgres.database.azure.com
          PG_HOST=$(echo "$PSQL_URL" | sed -E 's|postgresql://[^@]+@([^:/]+).*|\1|')
          PG_SERVER=$(echo "$PG_HOST" | cut -d'.' -f1)
          echo "Servidor PostgreSQL: $PG_SERVER"

          # Abrir firewall temporalmente para el runner
          az postgres flexible-server firewall-rule create \
            --resource-group "$RG" \
            --name "$PG_SERVER" \
            --rule-name "github-actions-runner-temp" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP" || true

          # Esperar a que la regla de firewall se propague
          sleep 10

          # ── 5. Reset completo + aplicar schema canónico ─────────────────────────
          echo "=== RESETEANDO base de datos de producción ==="

          # Reset atómico: drop schema + recrear limpio
          psql "$PSQL_URL" -c "DROP SCHEMA public CASCADE;"
          psql "$PSQL_URL" -c "CREATE SCHEMA public;"
          psql "$PSQL_URL" -c "GRANT ALL ON SCHEMA public TO PUBLIC;"
          psql "$PSQL_URL" -c "GRANT ALL ON SCHEMA public TO CURRENT_USER;"

          echo "Schema reseteado. Aplicando archivos SQL..."

          # Aplicar en orden estricto
          psql "$PSQL_URL" -f database/01_schema.sql
          echo "✓ 01_schema.sql"

          psql "$PSQL_URL" -f database/02_triggers.sql
          echo "✓ 02_triggers.sql"

          psql "$PSQL_URL" -f database/03_seeds_geograficos.sql
          echo "✓ 03_seeds_geograficos.sql"

          psql "$PSQL_URL" -f database/04_seeds_clinicos.sql
          echo "✓ 04_seeds_clinicos.sql"

          psql "$PSQL_URL" -f database/05_seeds_sistema.sql
          echo "✓ 05_seeds_sistema.sql"

          psql "$PSQL_URL" -f database/06_seeds_superadmin.sql
          echo "✓ 06_seeds_superadmin.sql"

          psql "$PSQL_URL" -f database/07a_demo_personas_pacientes.sql
          echo "✓ 07a_demo_personas_pacientes.sql"

          psql "$PSQL_URL" -f database/07b_demo_encuentros_clinicos.sql
          echo "✓ 07b_demo_encuentros_clinicos.sql"

          psql "$PSQL_URL" -f database/07c_demo_estudios_referencias.sql
          echo "✓ 07c_demo_estudios_referencias.sql"

          echo "=== Base de datos lista ==="

          # ── 6. Cerrar firewall temporal ─────────────────────────────────────────
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RG" \
            --name "$PG_SERVER" \
            --rule-name "github-actions-runner-temp" \
            --yes || true

          echo "Regla de firewall temporal eliminada."

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'media-backend-api-chiapas'
          slot-name: 'Production'
          package: 'backend_artifact/'
